<script>
// ===== IMAGE LOADING FROM cloudinary-config.json =====

let _config = null;
let _activeSmoothScroll = 0;
let _headerToneQueued = false;
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

async function loadConfig() {
  if (_config) return _config;
  const response = await fetch('cloudinary-config.json');
  _config = await response.json();
  return _config;
}

function getCloudinaryUrl(cloudName, publicId, width, height, crop) {
  let url = `https://res.cloudinary.com/${cloudName}/image/upload`;
  if (width || height) {
    url += `/w_${width || 'auto'},h_${height || 'auto'},c_${crop || 'fill'}`;
  }
  url += `/${publicId}`;
  return url;
}

async function fetchCloudinaryImages(cloudName, tag) {
  try {
    const response = await fetch(
      `https://res.cloudinary.com/${cloudName}/image/list/${tag}.json`
    );
    if (!response.ok) {
      console.warn(`Tag list error for ${tag}:`, response.status);
      return [];
    }
    const data = await response.json();
    if (!data.resources) return [];
    return data.resources.map(file => ({
      public_id: file.public_id,
      secure_url: `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto/${file.public_id}.jpg`,
      thumb: getCloudinaryUrl(cloudName, `f_auto,q_auto/${file.public_id}.jpg`, 150, 150, 'thumb'),
    }));
  } catch (error) {
    console.warn(`Error fetching images for tag ${tag}:`, error);
    return [];
  }
}

function setImageHints(el, options = {}) {
  if (!el) return;
  el.decoding = 'async';
  if (options.loading) el.loading = options.loading;
  if (options.fetchPriority) el.fetchPriority = options.fetchPriority;
  if (options.sizes) el.sizes = options.sizes;
}

function swapImageSource(imgEl, nextSrc) {
  if (!imgEl || !nextSrc) return;
  const currentSrc = imgEl.getAttribute('src') || '';
  if (new URL(currentSrc, window.location.href).href === new URL(nextSrc, window.location.href).href) return;
  imgEl.dataset.pendingSrc = nextSrc;
  imgEl.classList.add('ge-media-swapping');

  const preloader = new Image();
  preloader.decoding = 'async';
  preloader.onload = () => {
    if (imgEl.dataset.pendingSrc !== nextSrc) return;
    imgEl.src = nextSrc;
    requestAnimationFrame(() => {
      if (imgEl.dataset.pendingSrc === nextSrc) imgEl.classList.remove('ge-media-swapping');
    });
  };
  preloader.onerror = () => {
    if (imgEl.dataset.pendingSrc !== nextSrc) return;
    imgEl.src = nextSrc;
    imgEl.classList.remove('ge-media-swapping');
  };
  preloader.src = nextSrc;
}

async function injectStaticImages(config) {
  const allSingleImageKeys = { ...config.images.hero, ...config.images.about };
  for (const [key, entry] of Object.entries(allSingleImageKeys)) {
    const els = document.querySelectorAll(`[data-image-key="${key}"]`);
    if (!els.length) continue;
    const images = await fetchCloudinaryImages(config.cloudName, entry.tag);
    const src = images.length > 0 ? images[0].secure_url : entry.fallback;
    els.forEach(el => {
      setImageHints(el, {
        loading: key === 'hero-main' ? 'eager' : 'lazy',
        fetchPriority: key === 'hero-main' ? 'high' : 'auto',
      });
      el.src = src;
      if (entry.alt && !el.getAttribute('alt')) el.alt = entry.alt;
    });
  }
}

async function loadMachines(config) {
  try {
    const container = document.getElementById('machines-container');
    if (!container) return;
    const machines = Object.entries(config.images.machines)
      .map(([id, m]) => ({ id, ...m }))
      .filter(machine => !machine.sold);
    let hasAny = false;
    const machineDecks = await Promise.all(
      machines.map(async machine => ({
        machine,
        images: await fetchCloudinaryImages(config.cloudName, machine.tag),
      }))
    );

    for (const { machine, images } of machineDecks) {
      if (images.length === 0) continue;
      hasAny = true;
      const mainImg = images[0];

      // Store specs and full images array for the modal
      _machineSpecs[machine.id] = { title: machine.title, price: machine.price, specs: machine.specs || null, images };

      const thumbsHtml = images.map((img, idx) => `
        <button class="ge-thumb-btn" data-machine="${machine.id}" data-idx="${idx}"
          style="flex:none;width:54px;height:54px;padding:0;border:2px solid ${idx === 0 ? '#00ffcc' : 'transparent'};border-radius:4px;overflow:hidden;background:var(--ink-1000);cursor:pointer;">
          <img class="ge-cloudinary-image" src="${img.thumb}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${machine.title} thumbnail ${idx + 1}" decoding="async" loading="lazy">
        </button>
      `).join('');

      container.insertAdjacentHTML('beforeend', `
        <div class="ge-card ge-card--pad">
          <div style="position:relative;">
            <div class="ge-cut ge-machine-img-wrap" style="background:var(--ink-1000);aspect-ratio:16/9;cursor:pointer;" onclick="openMachineModal('${machine.id}')">
              <img class="ge-cloudinary-image ge-machine-main" id="${machine.id}-main" src="${mainImg.secure_url}" alt="${machine.title}" style="width:100%;height:100%;object-fit:cover;display:block;" decoding="async" loading="lazy">
            </div>
            <div style="position:absolute;top:12px;left:12px;">
              <span class="ge-badge ge-badge--volt"><span class="ge-badge__dot"></span>In stock</span>
            </div>
          </div>
          <h3 style="margin:16px 0 8px;font-size:18px;font-weight:600;color:var(--ink-900);">${machine.title}</h3>
          <p style="margin:0 0 12px;font-size:16px;font-weight:bold;color:var(--volt-600);">${machine.price}</p>
          <div style="display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;">
            ${thumbsHtml}
          </div>
          <button class="ge-btn ge-btn--secondary ge-btn--sm ge-details-btn" data-machine-id="${machine.id}"
            style="margin-top:14px;width:100%;">View Specs &amp; Details</button>
        </div>
      `);

      document.querySelectorAll(`[data-machine="${machine.id}"]`).forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.getAttribute('data-idx'));
          const mainEl = document.getElementById(`${machine.id}-main`);
          if (mainEl && images[idx]) swapImageSource(mainEl, images[idx].secure_url);
          document.querySelectorAll(`[data-machine="${machine.id}"]`).forEach(b => {
            b.style.borderColor = 'transparent';
          });
          this.style.borderColor = '#00ffcc';
        });
      });
    }

    if (!hasAny) {
      const availSection = document.getElementById('available');
      if (availSection) availSection.style.display = 'none';
    }
  } catch (e) {
    console.error('Machines load error:', e);
  }
}

async function loadPortfolio(config) {
  try {
    const images = await fetchCloudinaryImages(config.cloudName, config.images.portfolio.gallery.tag);
    const carousel = document.getElementById('portfolio-carousel');
    if (!carousel) return;

    if (images.length === 0) {
      carousel.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ink-400);">No portfolio images yet.</div>';
      return;
    }

    let current = 0;

    const slidesHtml = images.map((img, i) => `
      <div class="ge-portfolio-slide${i === 0 ? ' is-active' : ''}" data-slide="${i}" aria-hidden="${i === 0 ? 'false' : 'true'}">
        <img class="ge-cloudinary-image" src="${img.secure_url}" alt="Portfolio build ${i + 1}"
          decoding="async" loading="${i === 0 ? 'eager' : 'lazy'}">
      </div>
    `).join('');

    const dotsHtml = images.length > 1 ? images.map((_, i) => `
      <button class="ge-port-dot" data-dot="${i}" aria-label="Go to photo ${i + 1}"
        style="width:8px;height:8px;border-radius:50%;border:none;padding:0;cursor:pointer;background:${i === 0 ? 'var(--volt-400)' : 'var(--ink-600)'};transition:background .2s,transform .15s;"></button>
    `).join('') : '';

    const arrowStyle = 'position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,10,10,.7);border:1px solid rgba(255,255,255,.14);color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .2s,transform .15s;';

    carousel.innerHTML = `
      <div style="position:relative;user-select:none;">
        <div class="ge-portfolio-stage">${slidesHtml}</div>
        ${images.length > 1 ? `
          <button class="ge-port-prev" aria-label="Previous" style="${arrowStyle}left:-18px;">&#8249;</button>
          <button class="ge-port-next" aria-label="Next"     style="${arrowStyle}right:-18px;">&#8250;</button>
        ` : ''}
      </div>
      ${images.length > 1 ? `<div style="display:flex;justify-content:center;gap:8px;margin-top:16px;">${dotsHtml}</div>` : ''}
    `;

    const slides = carousel.querySelectorAll('.ge-portfolio-slide');
    const dots   = carousel.querySelectorAll('.ge-port-dot');

    function goTo(idx) {
      slides[current].classList.remove('is-active');
      slides[current].setAttribute('aria-hidden', 'true');
      dots[current] && (dots[current].style.background = 'var(--ink-600)');
      current = (idx + images.length) % images.length;
      slides[current].classList.add('is-active');
      slides[current].setAttribute('aria-hidden', 'false');
      dots[current] && (dots[current].style.background = 'var(--volt-400)');
    }

    carousel.querySelector('.ge-port-prev')?.addEventListener('click', () => goTo(current - 1));
    carousel.querySelector('.ge-port-next')?.addEventListener('click', () => goTo(current + 1));
    dots.forEach((dot, i) => dot.addEventListener('click', () => goTo(i)));

    // Touch / swipe support
    let touchStartX = 0;
    carousel.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    carousel.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) goTo(dx < 0 ? current + 1 : current - 1);
    });

  } catch (e) {
    console.error('Portfolio load error:', e);
  }
}

async function loadSoldBuilds(config) {
  try {
    const carousel = document.getElementById('sold-builds-carousel');
    const track    = document.getElementById('sold-builds-track');
    const dotsWrap = document.getElementById('sold-builds-dots');
    if (!carousel || !track) return;

    const machines = Object.entries(config.images.machines)
      .map(([id, m]) => ({ id, ...m }))
      .filter(m => m.sold);

    if (machines.length === 0) return;

    const decks = [];
    for (const machine of machines) {
      const images = await fetchCloudinaryImages(config.cloudName, machine.tag);
      if (images.length === 0) continue;
      _machineSpecs[machine.id] = { title: machine.title, price: machine.price, specs: machine.specs || null, images };
      decks.push({ machine, images });
    }

    if (decks.length === 0) return;

    let current = 0;

    function buildCard(deck, idx) {
      const { machine, images } = deck;
      const mainImg = images[0];
      const thumbsHtml = images.map((img, ti) => `
        <button class="ge-thumb-btn ge-sold-thumb-btn" data-sold-machine="${machine.id}" data-idx="${ti}"
          style="flex:none;width:48px;height:48px;padding:0;border:2px solid ${ti === 0 ? '#00ffcc' : 'transparent'};border-radius:4px;overflow:hidden;background:var(--ink-1000);cursor:pointer;">
          <img class="ge-cloudinary-image" src="${img.thumb}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${machine.title} thumbnail ${ti + 1}" decoding="async" loading="lazy">
        </button>
      `).join('');

      const card = document.createElement('div');
      card.className = 'ge-sold-card';
      card.setAttribute('data-card', idx);
      card.innerHTML = `
        <div style="position:relative;">
          <div class="ge-cut ge-machine-img-wrap" style="background:var(--ink-1000);aspect-ratio:16/9;cursor:pointer;" onclick="openMachineModal('${machine.id}')">
            <img class="ge-cloudinary-image ge-machine-main" id="${machine.id}-main" src="${mainImg.secure_url}" alt="${machine.title}" style="width:100%;height:100%;object-fit:cover;display:block;" decoding="async" loading="lazy">
          </div>
          <div style="position:absolute;top:12px;left:12px;">
            <span class="ge-badge ge-badge--solid" style="background:var(--ink-700);color:var(--ink-300);">
              <span class="ge-badge__dot" style="background:var(--ink-400);box-shadow:none;"></span>Not for sale
            </span>
          </div>
        </div>
        <h3 style="margin:16px 0 4px;font-size:18px;font-weight:600;color:#fff;">${machine.title}</h3>
        <p style="margin:0 0 12px;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-400);">Portfolio build · sold</p>
        <div style="display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px;">${thumbsHtml}</div>
        <button class="ge-btn ge-btn--dark ge-btn--sm ge-details-btn" data-machine-id="${machine.id}"
          style="margin-top:14px;width:100%;">View Specs &amp; Details</button>
      `;
      return card;
    }

    decks.forEach((deck, idx) => {
      track.appendChild(buildCard(deck, idx));
    });

    const dots = [];
    if (decks.length > 1) {
      decks.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'ge-sold-dot';
        dot.setAttribute('aria-label', `Go to build ${i + 1}`);
        dot.style.cssText = `width:8px;height:8px;border-radius:50%;border:none;padding:0;cursor:pointer;background:${i === 0 ? 'var(--volt-400)' : 'var(--ink-600)'};transition:background .2s,transform .15s;`;
        dot.addEventListener('click', () => goTo(i));
        dotsWrap.appendChild(dot);
        dots.push(dot);
      });
    }

    function goTo(idx) {
      current = ((idx % decks.length) + decks.length) % decks.length;
      track.style.transform = `translateX(calc(${current} * (var(--ge-sold-card-w) + 24px) * -1))`;
      dots.forEach((d, i) => d.style.background = i === current ? 'var(--volt-400)' : 'var(--ink-600)');
    }

    carousel.querySelector('.ge-sold-prev').addEventListener('click', () => goTo(current - 1));
    carousel.querySelector('.ge-sold-next').addEventListener('click', () => goTo(current + 1));

    let touchStartX = 0;
    track.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    track.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) goTo(dx < 0 ? current + 1 : current - 1);
    }, { passive: true });

    track.addEventListener('click', function(e) {
      const btn = e.target.closest('.ge-sold-thumb-btn');
      if (!btn) return;
      const machId = btn.getAttribute('data-sold-machine');
      const imgIdx = parseInt(btn.getAttribute('data-idx'), 10);
      const deck = decks.find(d => d.machine.id === machId);
      if (!deck) return;
      const mainEl = document.getElementById(`${machId}-main`);
      if (mainEl && deck.images[imgIdx]) swapImageSource(mainEl, deck.images[imgIdx].secure_url);
      track.querySelectorAll(`[data-sold-machine="${machId}"]`).forEach(b => b.style.borderColor = 'transparent');
      btn.style.borderColor = '#00ffcc';
    });

    carousel.style.display = '';
    goTo(0);
  } catch (e) {
    console.error('Sold builds carousel error:', e);
  }
}

// ===== PC DETAIL MODAL =====
const _machineSpecs = {};

function openMachineModal(machineId) {
  const data = _machineSpecs[machineId];
  if (!data) return;
  document.getElementById('ge-modal-title').textContent = data.title;
  document.getElementById('ge-modal-price').textContent = data.price;
  const modalImg = document.getElementById('ge-modal-img');
  setImageHints(modalImg, { loading: 'eager', fetchPriority: 'high' });
  const imgWrap = document.getElementById('ge-modal-img-wrap');
  const mainEl = document.getElementById(`${machineId}-main`);
  const activeUrl = mainEl ? mainEl.src : (data.images && data.images.length ? data.images[0].secure_url : '');
  if (modalImg && activeUrl) {
    swapImageSource(modalImg, activeUrl);
    modalImg.alt = data.title;
    imgWrap.style.display = 'block';
  } else if (imgWrap) {
    imgWrap.style.display = 'none';
  }

  const thumbsWrap = document.getElementById('ge-modal-thumbs');
  if (thumbsWrap && data.images && data.images.length > 1) {
    thumbsWrap.innerHTML = data.images.map((img, idx) => {
      const isActive = img.secure_url === activeUrl;
      return `<button class="ge-modal-thumb-btn" data-src="${img.secure_url}"
        style="flex:none;width:54px;height:54px;padding:0;border:2px solid ${isActive ? '#00ffcc' : 'transparent'};border-radius:4px;overflow:hidden;background:var(--ink-1000);cursor:pointer;">
        <img class="ge-cloudinary-image" src="${img.thumb}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${data.title} photo ${idx + 1}" decoding="async" loading="lazy">
      </button>`;
    }).join('');
    thumbsWrap.style.display = 'flex';
    thumbsWrap.querySelectorAll('.ge-modal-thumb-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        swapImageSource(modalImg, this.getAttribute('data-src'));
        thumbsWrap.querySelectorAll('.ge-modal-thumb-btn').forEach(b => b.style.borderColor = 'transparent');
        this.style.borderColor = '#00ffcc';
      });
    });
  } else if (thumbsWrap) {
    thumbsWrap.innerHTML = '';
    thumbsWrap.style.display = 'none';
  }

  const specList = document.getElementById('ge-modal-specs');
  specList.innerHTML = data.specs ? Object.entries(data.specs).map(([k, v]) => `
    <div class="ge-spec ge-spec--dark">
      <span class="ge-spec__key">${k}</span>
      <span class="ge-spec__lead"></span>
      <span class="ge-spec__val">${v}</span>
    </div>
  `).join('') : '';
  const modal = document.getElementById('ge-pc-modal');
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeMachineModal() {
  document.getElementById('ge-pc-modal').style.display = 'none';
  document.body.style.overflow = '';
}

// ===== ADAPTIVE HEADER TONE SWITCHING =====
function updateHeaderTone() {
  const header = document.querySelector('.ge-header');
  if (!header) return;
  const probe = header.getBoundingClientRect().bottom - 1;
  let tone = 'dark';
  document.querySelectorAll('[data-tone]').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.top <= probe && r.bottom > probe) {
      tone = el.getAttribute('data-tone');
    }
  });
  header.classList.toggle('ge-header--light', tone === 'light');
}

function queueHeaderToneUpdate() {
  if (_headerToneQueued) return;
  _headerToneQueued = true;
  requestAnimationFrame(() => {
    _headerToneQueued = false;
    updateHeaderTone();
  });
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function smoothScrollToSection(target) {
  if (!target) return;
  const header = document.querySelector('.ge-header');
  const headerOffset = header ? header.getBoundingClientRect().height : 0;
  const startY = window.pageYOffset;
  const targetY = Math.max(0, target.getBoundingClientRect().top + startY - headerOffset);

  if (prefersReducedMotion.matches) {
    window.scrollTo(0, targetY);
    queueHeaderToneUpdate();
    return;
  }

  cancelAnimationFrame(_activeSmoothScroll);
  const distance = targetY - startY;
  const duration = Math.min(900, Math.max(500, Math.abs(distance) * 0.45));
  let startTime = 0;

  const step = (timestamp) => {
    if (!startTime) startTime = timestamp;
    const progress = Math.min((timestamp - startTime) / duration, 1);
    const eased = easeOutCubic(progress);
    window.scrollTo(0, startY + distance * eased);
    queueHeaderToneUpdate();
    if (progress < 1) {
      _activeSmoothScroll = requestAnimationFrame(step);
    } else {
      _activeSmoothScroll = 0;
    }
  };

  _activeSmoothScroll = requestAnimationFrame(step);
}

function initSmoothSectionLinks() {
  document.addEventListener('click', function(e) {
    const link = e.target.closest('a[href^="#"]');
    if (!link) return;
    if (link.target && link.target !== '_self') return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.defaultPrevented) return;

    const href = link.getAttribute('href');
    if (!href || href === '#') return;
    const target = document.querySelector(href);
    if (!target) return;

    e.preventDefault();
    if (window.location.hash !== href) {
      history.pushState(null, '', href);
    }
    smoothScrollToSection(target);
  });
}

function handleHistoryNavigation() {
  const target = window.location.hash
    ? document.querySelector(window.location.hash)
    : document.getElementById('top');
  if (!target) return;
  smoothScrollToSection(target);
}

// ===== BOOT =====
document.addEventListener('DOMContentLoaded', async function() {
  // Init Lucide icons
  if (typeof lucide !== 'undefined') lucide.createIcons();

  // Adaptive header on scroll
  window.addEventListener('scroll', queueHeaderToneUpdate, { passive: true });
  window.addEventListener('resize', queueHeaderToneUpdate, { passive: true });
  window.addEventListener('popstate', handleHistoryNavigation);
  initSmoothSectionLinks();
  if (window.location.hash) handleHistoryNavigation();
  queueHeaderToneUpdate();

  // Modal close handlers
  document.getElementById('ge-modal-close')?.addEventListener('click', closeMachineModal);
  document.getElementById('ge-pc-modal')?.addEventListener('click', function(e) {
    if (e.target === this) closeMachineModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeMachineModal();
  });

  // Details buttons (delegated — injected after config loads)
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.ge-details-btn');
    if (btn) openMachineModal(btn.getAttribute('data-machine-id'));
  });

  // Load images from config
  try {
    const config = await loadConfig();
    await injectStaticImages(config);
    await loadMachines(config);
    await loadSoldBuilds(config);
    await loadPortfolio(config);
  } catch (e) {
    console.error('Failed to load cloudinary-config.json:', e);
  }
});
</script>
</body>
</html>
