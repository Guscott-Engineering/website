<script>
// ===== IMAGE LOADING FROM cloudinary-config.json =====

let _config = null;
let _configRequest = null;
let _configRequestForce = false;
let _configRequestGeneration = 0;
let _inventoryRefreshRequest = null;
let _inventoryRefreshPending = false;
let _scheduledInventoryRefresh = null;
let _scheduledInventoryRefreshTimer = null;
let _scheduledInventoryRefreshDueAt = 0;
let _scheduledInventoryRefreshResolve = null;
let _scheduledInventoryRefreshReject = null;
let _initialBootstrapRequest = null;
let _hasCompletedInitialConfigBootstrap = false;
let _bootstrapNeedsForceRefresh = false;
let _bootstrapDeferredRefreshMinInterval = 0;
let _lastInventoryRefreshAt = 0;
let _lastInventoryRefreshStartedAt = 0;
let _activeSmoothScroll = 0;
let _headerToneQueued = false;
let _skipNextHashChange = false;
const _loadedImageUrls = new Set();
const _imagePreloadPromises = new Map();
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const INVENTORY_REFRESH_DEBOUNCE_MS = 1500;

async function loadConfig(forceRefresh = false) {
  if (_config && !forceRefresh) return _config;
  if (_configRequest && (!forceRefresh || _configRequestForce)) return _configRequest;
  const requestUrl = `cloudinary-config.json?v=${Date.now()}`;
  const generation = ++_configRequestGeneration;
  _configRequestForce = forceRefresh;
  const request = fetch(requestUrl, { cache: 'no-store' })
    .then(async response => {
      if (!response.ok) throw new Error(`Config load failed: ${response.status}`);
      const nextConfig = await response.json();
      if (generation === _configRequestGeneration) {
        _config = nextConfig;
      }
      return nextConfig;
    })
    .finally(() => {
      if (_configRequest === request) {
        _configRequest = null;
        _configRequestForce = false;
      }
    });
  _configRequest = request;
  return request;
}

function getCloudinaryUrl(cloudName, publicId, width, height, crop) {
  let url = `https://res.cloudinary.com/${cloudName}/image/upload`;
  if (width || height) {
    url += `/w_${width || 'auto'},h_${height || 'auto'},c_${crop || 'fill'}`;
  }
  url += `/${publicId}`;
  return url;
}

function escapeHtmlText(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[char]));
}

function escapeHtmlAttribute(value) {
  return escapeHtmlText(value);
}

function getMachineMainImageId(machineId) {
  return `machine-main-${String(machineId).replace(/[^a-zA-Z0-9_-]/g, char => `_${char.codePointAt(0).toString(16)}`)}`;
}

function getMachineEntries(config) {
  if (!config?.images || typeof config.images.machines !== 'object' || config.images.machines === null) {
    throw new Error('Invalid config: missing images.machines');
  }
  return Object.entries(config.images.machines);
}

async function fetchCloudinaryImages(cloudName, tag) {
  try {
    const response = await fetch(
      `https://res.cloudinary.com/${cloudName}/image/list/${tag}.json`
    );
    if (!response.ok) {
      console.warn(`Tag list error for ${tag}:`, response.status);
      return [];
    }
    const data = await response.json();
    if (!data.resources) return [];
    return data.resources.map(file => ({
      public_id: file.public_id,
      secure_url: `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto/${file.public_id}.jpg`,
      thumb: getCloudinaryUrl(cloudName, `f_auto,q_auto/${file.public_id}.jpg`, 150, 150, 'thumb'),
    }));
  } catch (error) {
    console.warn(`Error fetching images for tag ${tag}:`, error);
    return [];
  }
}

function setImageHints(el, options = {}) {
  if (!el) return;
  el.decoding = 'async';
  if (el.complete && (el.currentSrc || el.src)) {
    _loadedImageUrls.add(normalizeUrl(el.currentSrc || el.src));
  }
  el.addEventListener('load', () => {
    if (el.currentSrc || el.src) _loadedImageUrls.add(normalizeUrl(el.currentSrc || el.src));
  }, { once: true });
  if (options.loading) el.loading = options.loading;
  if (options.fetchPriority) el.fetchPriority = options.fetchPriority;
  if (options.sizes) el.sizes = options.sizes;
}

function normalizeUrl(src) {
  try {
    return new URL(src, window.location.href).href;
  } catch (error) {
    return src;
  }
}

function swapImageSource(imgEl, nextSrc) {
  if (!imgEl || !nextSrc) return;
  const normalizedNextSrc = normalizeUrl(nextSrc);
  const currentSrc = imgEl.getAttribute('src') || '';
  if (normalizeUrl(currentSrc) === normalizedNextSrc) return;
  imgEl.dataset.pendingSrc = nextSrc;
  imgEl.classList.add('ge-media-swapping');

  if (_loadedImageUrls.has(normalizedNextSrc)) {
    imgEl.src = nextSrc;
    _loadedImageUrls.add(normalizedNextSrc);
    requestAnimationFrame(() => {
      if (imgEl.dataset.pendingSrc === nextSrc) imgEl.classList.remove('ge-media-swapping');
    });
    return;
  }

  let preloadPromise = _imagePreloadPromises.get(normalizedNextSrc);
  if (!preloadPromise) {
    preloadPromise = new Promise((resolve, reject) => {
      const preloader = new Image();
      preloader.decoding = 'async';
      preloader.onload = () => {
        _loadedImageUrls.add(normalizedNextSrc);
        _imagePreloadPromises.delete(normalizedNextSrc);
        resolve();
      };
      preloader.onerror = () => {
        _imagePreloadPromises.delete(normalizedNextSrc);
        reject(new Error(`Failed to preload ${nextSrc}`));
      };
      preloader.src = nextSrc;
    });
    _imagePreloadPromises.set(normalizedNextSrc, preloadPromise);
  }

  preloadPromise.then(() => {
    if (imgEl.dataset.pendingSrc !== nextSrc) return;
    imgEl.src = nextSrc;
    requestAnimationFrame(() => {
      if (imgEl.dataset.pendingSrc === nextSrc) imgEl.classList.remove('ge-media-swapping');
    });
  }).catch(() => {
    if (imgEl.dataset.pendingSrc !== nextSrc) return;
    imgEl.src = nextSrc;
    imgEl.classList.remove('ge-media-swapping');
  });
}

async function injectStaticImages(config) {
  const allSingleImageKeys = { ...config.images.hero, ...config.images.about };
  for (const [key, entry] of Object.entries(allSingleImageKeys)) {
    const els = document.querySelectorAll(`[data-image-key="${key}"]`);
    if (!els.length) continue;
    const images = await fetchCloudinaryImages(config.cloudName, entry.tag);
    const src = images.length > 0 ? images[0].secure_url : entry.fallback;
    els.forEach(el => {
      setImageHints(el, {
        loading: key === 'hero-main' ? 'eager' : 'lazy',
        fetchPriority: key === 'hero-main' ? 'high' : 'auto',
      });
      el.src = src;
      if (entry.alt && !el.getAttribute('alt')) el.alt = entry.alt;
    });
  }
}

async function loadMachines(config) {
  try {
    const availSection = document.getElementById('available');
    const container = document.getElementById('machines-container');
    if (!container) return;
    const machineEntries = getMachineEntries(config);
    container.innerHTML = '';
    const machines = machineEntries
      .map(([id, m]) => ({ id, ...m }))
      .filter(machine => !machine.sold);
    if (machines.length === 0) {
      if (availSection) availSection.style.display = 'none';
      return;
    }
    let renderedCount = 0;
    const machineDecks = await Promise.all(
      machines.map(async machine => ({
        machine,
        images: await fetchCloudinaryImages(config.cloudName, machine.tag),
      }))
    );

    for (const { machine, images } of machineDecks) {
      const machineId = String(machine.id);
      const machineToken = encodeURIComponent(machineId);
      const machineMainImageId = getMachineMainImageId(machineId);
      const rawTitle = String(machine.title || machine.id);
      const titleText = escapeHtmlText(rawTitle);
      const titleAttr = escapeHtmlAttribute(rawTitle);
      const priceText = escapeHtmlText(machine.price || 'Contact for price');
      const mainImg = images[0];

      // Store specs and full images array for the modal
      _machineIdByToken[machineToken] = machineId;
      _machineSpecs[machineId] = { title: machine.title, price: machine.price, specs: machine.specs || null, images };

      const thumbsHtml = images.map((img, idx) => `
        <button class="ge-thumb-btn" data-machine-token="${machineToken}" data-idx="${idx}"
          style="flex:none;width:54px;height:54px;padding:0;border:2px solid ${idx === 0 ? '#00ffcc' : 'transparent'};border-radius:4px;overflow:hidden;background:var(--ink-1000);cursor:pointer;">
          <img class="ge-cloudinary-image" src="${img.thumb}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${titleAttr} thumbnail ${idx + 1}" decoding="async" loading="lazy">
        </button>
      `).join('');
      const mediaHtml = images.length > 0
        ? `
            <button type="button" class="ge-cut ge-machine-img-wrap" data-open-machine-token="${machineToken}" aria-label="Open details for ${titleAttr}" style="display:block;width:100%;padding:0;border:none;background:var(--ink-1000);aspect-ratio:16/9;cursor:pointer;text-align:inherit;">
              <img class="ge-cloudinary-image ge-machine-main" id="${machineMainImageId}" src="${mainImg.secure_url}" alt="${titleAttr}" style="width:100%;height:100%;object-fit:cover;display:block;" decoding="async" loading="lazy">
            </button>
          `
        : `
            <button type="button" class="ge-cut ge-machine-img-wrap" data-open-machine-token="${machineToken}" aria-label="Open details for ${titleAttr}" style="display:block;width:100%;padding:18px;border:none;background:linear-gradient(135deg,var(--ink-950),var(--ink-850));aspect-ratio:16/9;cursor:pointer;text-align:inherit;">
              <div class="ge-slot" style="height:100%;background:rgba(255,255,255,.02);border-radius:8px;">
                <span class="ge-slot__cap">Photos for ${titleText} coming soon</span>
              </div>
            </button>
          `;

      container.insertAdjacentHTML('beforeend', `
        <div class="ge-card ge-card--pad">
          <div style="position:relative;">
            ${mediaHtml}
            <div style="position:absolute;top:12px;left:12px;">
              <span class="ge-badge ge-badge--volt"><span class="ge-badge__dot"></span>In stock</span>
            </div>
          </div>
          <h3 style="margin:16px 0 8px;font-size:18px;font-weight:600;color:var(--ink-900);">${titleText}</h3>
          <p style="margin:0 0 12px;font-size:16px;font-weight:bold;color:var(--volt-600);">${priceText}</p>
          ${thumbsHtml ? `
            <div style="display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;">
              ${thumbsHtml}
            </div>
          ` : ''}
          <button class="ge-btn ge-btn--secondary ge-btn--sm ge-details-btn" data-machine-token="${machineToken}"
            style="margin-top:14px;width:100%;">View Specs &amp; Details</button>
        </div>
      `);
      renderedCount++;
    }
    if (availSection) {
      availSection.style.display = renderedCount > 0 ? '' : 'none';
    }
    if (!container.dataset.boundThumbInteractions) {
      container.dataset.boundThumbInteractions = 'true';
      container.addEventListener('click', function(e) {
        const btn = e.target.closest('.ge-thumb-btn');
        if (!btn) return;
        const machineToken = btn.getAttribute('data-machine-token');
        const imgIdx = parseInt(btn.getAttribute('data-idx'), 10);
        const machineId = machineToken ? _machineIdByToken[machineToken] : null;
        const machineData = machineId ? _machineSpecs[machineId] : null;
        const mainEl = machineId ? document.getElementById(getMachineMainImageId(machineId)) : null;
        if (mainEl && machineData?.images?.[imgIdx]) {
          swapImageSource(mainEl, machineData.images[imgIdx].secure_url);
        }
        this.querySelectorAll(`.ge-thumb-btn[data-machine-token="${machineToken}"]`).forEach(thumb => {
          thumb.style.borderColor = 'transparent';
        });
        btn.style.borderColor = '#00ffcc';
      });
    }
  } catch (e) {
    console.error('Machines load error:', e);
  }
}

async function loadPortfolio(config) {
  try {
    const images = await fetchCloudinaryImages(config.cloudName, config.images.portfolio.gallery.tag);
    const carousel = document.getElementById('portfolio-carousel');
    if (!carousel) return;

    if (images.length === 0) {
      carousel.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ink-400);">No portfolio images yet.</div>';
      return;
    }

    let current = 0;

    const slidesHtml = images.map((img, i) => `
      <div class="ge-portfolio-slide${i === 0 ? ' is-active' : ''}" data-slide="${i}" aria-hidden="${i === 0 ? 'false' : 'true'}">
        <img class="ge-cloudinary-image" src="${img.secure_url}" alt="Portfolio build ${i + 1}"
          decoding="async" loading="${i === 0 ? 'eager' : 'lazy'}">
      </div>
    `).join('');

    const dotsHtml = images.length > 1 ? images.map((_, i) => `
      <button class="ge-port-dot" data-dot="${i}" aria-label="Go to photo ${i + 1}"
        style="width:8px;height:8px;border-radius:50%;border:none;padding:0;cursor:pointer;background:${i === 0 ? 'var(--volt-400)' : 'var(--ink-600)'};transition:background .2s,transform .15s;"></button>
    `).join('') : '';

    const arrowStyle = 'position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,10,10,.7);border:1px solid rgba(255,255,255,.14);color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .2s,transform .15s;';

    carousel.innerHTML = `
      <div style="position:relative;user-select:none;">
        <div class="ge-portfolio-stage">${slidesHtml}</div>
        ${images.length > 1 ? `
          <button class="ge-port-prev" aria-label="Previous" style="${arrowStyle}left:-18px;">&#8249;</button>
          <button class="ge-port-next" aria-label="Next"     style="${arrowStyle}right:-18px;">&#8250;</button>
        ` : ''}
      </div>
      ${images.length > 1 ? `<div style="display:flex;justify-content:center;gap:8px;margin-top:16px;">${dotsHtml}</div>` : ''}
    `;

    const slides = carousel.querySelectorAll('.ge-portfolio-slide');
    const dots   = carousel.querySelectorAll('.ge-port-dot');

    function goTo(idx) {
      slides[current].classList.remove('is-active');
      slides[current].setAttribute('aria-hidden', 'true');
      dots[current] && (dots[current].style.background = 'var(--ink-600)');
      current = (idx + images.length) % images.length;
      slides[current].classList.add('is-active');
      slides[current].setAttribute('aria-hidden', 'false');
      dots[current] && (dots[current].style.background = 'var(--volt-400)');
    }

    carousel.querySelector('.ge-port-prev')?.addEventListener('click', () => goTo(current - 1));
    carousel.querySelector('.ge-port-next')?.addEventListener('click', () => goTo(current + 1));
    dots.forEach((dot, i) => dot.addEventListener('click', () => goTo(i)));

    // Touch / swipe support
    let touchStartX = 0;
    carousel.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    carousel.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) goTo(dx < 0 ? current + 1 : current - 1);
    });

  } catch (e) {
    console.error('Portfolio load error:', e);
  }
}

async function loadSoldBuilds(config) {
  try {
    const carousel = document.getElementById('sold-builds-carousel');
    if (!carousel) return;
    const machineEntries = getMachineEntries(config);
    carousel.style.display = 'none';
    carousel.innerHTML = `
      <div class="ge-sold-track-wrap">
        <div class="ge-sold-track"></div>
      </div>
      <div class="ge-sold-nav">
        <button class="ge-sold-prev" aria-label="Previous build">&#8249;</button>
        <div class="ge-sold-dots"></div>
        <button class="ge-sold-next" aria-label="Next build">&#8250;</button>
      </div>
    `;
    const track = carousel.querySelector('.ge-sold-track');
    const dotsWrap = carousel.querySelector('.ge-sold-dots');
    if (!track || !dotsWrap) return;

    const machines = machineEntries
      .map(([id, m]) => ({ id, ...m }))
      .filter(m => m.sold);

    if (machines.length === 0) return;

    const decks = [];
    for (const machine of machines) {
      const machineId = String(machine.id);
      const machineToken = encodeURIComponent(machineId);
      const images = await fetchCloudinaryImages(config.cloudName, machine.tag);
      if (images.length === 0) continue;
      _machineIdByToken[machineToken] = machineId;
      _machineSpecs[machineId] = { title: machine.title, price: machine.price, specs: machine.specs || null, images };
      decks.push({ machine, images });
    }

    if (decks.length === 0) return;

    let current = 0;

    function buildCard(deck, idx) {
      const { machine, images } = deck;
      const machineId = String(machine.id);
      const machineToken = encodeURIComponent(machineId);
      const machineMainImageId = getMachineMainImageId(machineId);
      const titleAttr = escapeHtmlAttribute(machine.title || machine.id);
      const titleText = escapeHtmlText(machine.title || machine.id);
      const mainImg = images[0];
      const thumbsHtml = images.map((img, ti) => `
        <button class="ge-thumb-btn ge-sold-thumb-btn" data-sold-machine-token="${machineToken}" data-idx="${ti}"
          style="flex:none;width:48px;height:48px;padding:0;border:2px solid ${ti === 0 ? '#00ffcc' : 'transparent'};border-radius:4px;overflow:hidden;background:var(--ink-1000);cursor:pointer;">
          <img class="ge-cloudinary-image" src="${img.thumb}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${titleAttr} thumbnail ${ti + 1}" decoding="async" loading="lazy">
        </button>
      `).join('');

      const card = document.createElement('div');
      card.className = 'ge-sold-card';
      card.setAttribute('data-card', idx);
      card.innerHTML = `
        <div style="position:relative;">
          <button type="button" class="ge-cut ge-machine-img-wrap" data-open-machine-token="${machineToken}" aria-label="Open details for ${titleAttr}" style="display:block;width:100%;padding:0;border:none;background:var(--ink-1000);aspect-ratio:16/9;cursor:pointer;text-align:inherit;">
            <img class="ge-cloudinary-image ge-machine-main" id="${machineMainImageId}" src="${mainImg.secure_url}" alt="${titleAttr}" style="width:100%;height:100%;object-fit:cover;display:block;" decoding="async" loading="lazy">
          </button>
          <div style="position:absolute;top:12px;left:12px;">
            <span class="ge-badge ge-badge--solid" style="background:var(--ink-700);color:var(--ink-300);">
              <span class="ge-badge__dot" style="background:var(--ink-400);box-shadow:none;"></span>Not for sale
            </span>
          </div>
        </div>
        <h3 style="margin:16px 0 4px;font-size:18px;font-weight:600;color:#fff;">${titleText}</h3>
        <p style="margin:0 0 12px;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-400);">Portfolio build · sold</p>
        <div style="display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px;">${thumbsHtml}</div>
        <button class="ge-btn ge-btn--dark ge-btn--sm ge-details-btn" data-machine-token="${machineToken}"
          style="margin-top:14px;width:100%;">View Specs &amp; Details</button>
      `;
      return card;
    }

    decks.forEach((deck, idx) => {
      track.appendChild(buildCard(deck, idx));
    });

    const dots = [];
    if (decks.length > 1) {
      decks.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'ge-sold-dot';
        dot.setAttribute('data-sold-dot', String(i));
        dot.setAttribute('aria-label', `Go to build ${i + 1}`);
        dot.style.cssText = `width:8px;height:8px;border-radius:50%;border:none;padding:0;cursor:pointer;background:${i === 0 ? 'var(--volt-400)' : 'var(--ink-600)'};transition:background .2s,transform .15s;`;
        dotsWrap.appendChild(dot);
        dots.push(dot);
      });
    }

    function goTo(idx) {
      current = ((idx % decks.length) + decks.length) % decks.length;
      carousel._soldCurrent = current;
      track.style.transform = `translateX(calc(${current} * (var(--ge-sold-card-w) + 24px) * -1))`;
      dots.forEach((d, i) => d.style.background = i === current ? 'var(--volt-400)' : 'var(--ink-600)');
    }

    carousel._soldDecks = decks;
    carousel._soldGoTo = goTo;
    carousel._soldCurrent = current;
    carousel._soldTouchStartX = 0;

    if (!carousel.dataset.boundInteractions) {
      carousel.dataset.boundInteractions = 'true';
      carousel.addEventListener('click', function(e) {
        const prevBtn = e.target.closest('.ge-sold-prev');
        if (prevBtn) {
          this._soldGoTo?.((this._soldCurrent || 0) - 1);
          return;
        }
        const nextBtn = e.target.closest('.ge-sold-next');
        if (nextBtn) {
          this._soldGoTo?.((this._soldCurrent || 0) + 1);
          return;
        }
        const dotBtn = e.target.closest('[data-sold-dot]');
        if (dotBtn) {
          const dotIdx = parseInt(dotBtn.getAttribute('data-sold-dot'), 10);
          if (!Number.isNaN(dotIdx)) this._soldGoTo?.(dotIdx);
          return;
        }
        const btn = e.target.closest('.ge-sold-thumb-btn');
        if (!btn) return;
        const machineToken = btn.getAttribute('data-sold-machine-token');
        const imgIdx = parseInt(btn.getAttribute('data-idx'), 10);
        const machineId = machineToken ? _machineIdByToken[machineToken] : null;
        const deck = this._soldDecks?.find(d => String(d.machine.id) === machineId);
        if (!deck) return;
        const mainEl = document.getElementById(getMachineMainImageId(machineId));
        if (mainEl && deck.images[imgIdx]) swapImageSource(mainEl, deck.images[imgIdx].secure_url);
        this.querySelectorAll(`.ge-sold-thumb-btn[data-sold-machine-token="${machineToken}"]`).forEach(b => b.style.borderColor = 'transparent');
        btn.style.borderColor = '#00ffcc';
      });
      carousel.addEventListener('touchstart', function(e) {
        this._soldTouchStartX = e.changedTouches[0].clientX;
      }, { passive: true });
      carousel.addEventListener('touchend', function(e) {
        const dx = e.changedTouches[0].clientX - (this._soldTouchStartX || 0);
        if (Math.abs(dx) > 40) this._soldGoTo?.(dx < 0 ? (this._soldCurrent || 0) + 1 : (this._soldCurrent || 0) - 1);
      }, { passive: true });
    }

    carousel.style.display = '';
    goTo(0);
  } catch (e) {
    console.error('Sold builds carousel error:', e);
  }
}

async function renderInventoryFromConfig(config) {
  Object.keys(_machineIdByToken).forEach(key => delete _machineIdByToken[key]);
  Object.keys(_machineSpecs).forEach(key => delete _machineSpecs[key]);
  await loadMachines(config);
  await loadSoldBuilds(config);
  queueHeaderToneUpdate();
  return config;
}

async function bootstrapSiteFromConfig(forceRefresh = false) {
  if (_initialBootstrapRequest) {
    if (forceRefresh) _bootstrapNeedsForceRefresh = true;
    return _initialBootstrapRequest;
  }
  _initialBootstrapRequest = (async () => {
    let nextForceRefresh = forceRefresh;
    let config = null;
    do {
      _bootstrapNeedsForceRefresh = false;
      config = await loadConfig(nextForceRefresh);
      await injectStaticImages(config);
      await renderInventoryFromConfig(config);
      await loadPortfolio(config);
      _hasCompletedInitialConfigBootstrap = true;
      _lastInventoryRefreshAt = Date.now();
      if (_bootstrapNeedsForceRefresh && _bootstrapDeferredRefreshMinInterval > 0) {
        const deferredInterval = _bootstrapDeferredRefreshMinInterval;
        _bootstrapDeferredRefreshMinInterval = 0;
        return await scheduleInventoryRefresh(deferredInterval);
      }
      nextForceRefresh = _bootstrapNeedsForceRefresh;
    } while (nextForceRefresh);
    return config;
  })().finally(() => {
    _initialBootstrapRequest = null;
  });
  return _initialBootstrapRequest;
}

function scheduleInventoryRefresh(delayMs) {
  if (_scheduledInventoryRefreshTimer) clearTimeout(_scheduledInventoryRefreshTimer);
  if (!_scheduledInventoryRefresh) {
    _scheduledInventoryRefresh = new Promise((resolve, reject) => {
      _scheduledInventoryRefreshResolve = resolve;
      _scheduledInventoryRefreshReject = reject;
    });
  }
  _scheduledInventoryRefreshTimer = setTimeout(async () => {
    const resolve = _scheduledInventoryRefreshResolve;
    const reject = _scheduledInventoryRefreshReject;
    _scheduledInventoryRefreshResolve = null;
    _scheduledInventoryRefreshReject = null;
    _scheduledInventoryRefreshTimer = null;
    _scheduledInventoryRefreshDueAt = 0;
    _scheduledInventoryRefresh = null;
    refreshInventoryFromConfig().then(resolve, reject);
  }, delayMs);
  _scheduledInventoryRefreshDueAt = Date.now() + delayMs;
  return _scheduledInventoryRefresh;
}

function flushScheduledInventoryRefresh() {
  if (!_scheduledInventoryRefresh) {
    return _inventoryRefreshRequest || Promise.resolve(_config);
  }
  if (_inventoryRefreshRequest) {
    _inventoryRefreshPending = true;
    if (_scheduledInventoryRefreshTimer) clearTimeout(_scheduledInventoryRefreshTimer);
    _scheduledInventoryRefreshTimer = null;
    _scheduledInventoryRefreshDueAt = 0;
    const scheduledPromise = _scheduledInventoryRefresh;
    const resolve = _scheduledInventoryRefreshResolve;
    const reject = _scheduledInventoryRefreshReject;
    _scheduledInventoryRefreshResolve = null;
    _scheduledInventoryRefreshReject = null;
    _scheduledInventoryRefresh = null;
    _inventoryRefreshRequest.then(resolve, reject);
    return scheduledPromise;
  }
  if (_scheduledInventoryRefreshTimer) clearTimeout(_scheduledInventoryRefreshTimer);
  _scheduledInventoryRefreshTimer = null;
  _scheduledInventoryRefreshDueAt = 0;
  const resolve = _scheduledInventoryRefreshResolve;
  const reject = _scheduledInventoryRefreshReject;
  _scheduledInventoryRefreshResolve = null;
  _scheduledInventoryRefreshReject = null;
  _scheduledInventoryRefresh = null;
  const immediateRefresh = refreshInventoryFromConfig();
  if (resolve || reject) immediateRefresh.then(resolve, reject);
  return immediateRefresh;
}

async function refreshInventoryFromConfig() {
  if (_inventoryRefreshRequest) {
    _inventoryRefreshPending = true;
    return _inventoryRefreshRequest;
  }
  _inventoryRefreshRequest = (async () => {
    let config = null;
    let refreshError = null;
    _inventoryRefreshPending = false;
    _lastInventoryRefreshStartedAt = Date.now();
    try {
      config = await loadConfig(true);
      await renderInventoryFromConfig(config);
      _lastInventoryRefreshAt = Date.now();
    } catch (error) {
      console.error('Inventory refresh error:', error);
      refreshError = error;
    } finally {
      const shouldRunAgain = _inventoryRefreshPending;
      _inventoryRefreshRequest = null;
      if (shouldRunAgain) {
        _inventoryRefreshPending = false;
        return refreshInventoryFromConfig();
      }
    }
    if (refreshError) throw refreshError;
    return config;
  });
  return _inventoryRefreshRequest;
}

function requestInventoryRefresh(minIntervalMs = 0) {
  if (!_hasCompletedInitialConfigBootstrap) {
    if (_initialBootstrapRequest) {
      if (minIntervalMs > 0) {
        _bootstrapNeedsForceRefresh = true;
        _bootstrapDeferredRefreshMinInterval = Math.max(_bootstrapDeferredRefreshMinInterval, minIntervalMs);
        return _initialBootstrapRequest;
      }
      return bootstrapSiteFromConfig(true);
    }
    return bootstrapSiteFromConfig(true);
  }
  if (_inventoryRefreshRequest) {
    _inventoryRefreshPending = true;
    return _inventoryRefreshRequest;
  }
  if (!_config) return refreshInventoryFromConfig();
  const lastRefreshMarker = Math.max(_lastInventoryRefreshStartedAt || 0, _lastInventoryRefreshAt || 0);
  if (lastRefreshMarker) {
    const elapsed = Date.now() - lastRefreshMarker;
    if (_scheduledInventoryRefresh) {
      if (minIntervalMs === 0) return flushScheduledInventoryRefresh();
      const remainingDelay = Math.max(0, _scheduledInventoryRefreshDueAt - Date.now());
      const desiredDelay = Math.max(0, minIntervalMs - elapsed);
      if (desiredDelay < remainingDelay) {
        return scheduleInventoryRefresh(desiredDelay);
      }
      return _scheduledInventoryRefresh;
    }
    if (elapsed < minIntervalMs) {
      return scheduleInventoryRefresh(minIntervalMs - elapsed);
    }
  }
  if (_scheduledInventoryRefresh) return _scheduledInventoryRefresh;
  return refreshInventoryFromConfig();
}

// ===== PC DETAIL MODAL =====
const _machineSpecs = {};
const _machineIdByToken = {};

function openMachineModal(machineId) {
  const data = _machineSpecs[machineId];
  if (!data) return;
  document.getElementById('ge-modal-title').textContent = data.title;
  document.getElementById('ge-modal-price').textContent = data.price;
  const modalImg = document.getElementById('ge-modal-img');
  setImageHints(modalImg, { loading: 'eager', fetchPriority: 'high' });
  const imgWrap = document.getElementById('ge-modal-img-wrap');
  const mainEl = document.getElementById(getMachineMainImageId(machineId));
  const hasImages = Array.isArray(data.images) && data.images.length > 0;
  const activeUrl = mainEl?.src || (hasImages ? data.images[0].secure_url : '');
  if (modalImg && hasImages && activeUrl) {
    swapImageSource(modalImg, activeUrl);
    modalImg.alt = data.title;
    imgWrap.style.display = 'block';
  } else if (imgWrap) {
    imgWrap.style.display = 'none';
  }

  const thumbsWrap = document.getElementById('ge-modal-thumbs');
  if (thumbsWrap && hasImages && data.images.length > 1) {
    thumbsWrap.innerHTML = data.images.map((img, idx) => {
      const isActive = img.secure_url === activeUrl;
      return `<button class="ge-modal-thumb-btn" data-src="${img.secure_url}"
        style="flex:none;width:54px;height:54px;padding:0;border:2px solid ${isActive ? '#00ffcc' : 'transparent'};border-radius:4px;overflow:hidden;background:var(--ink-1000);cursor:pointer;">
        <img class="ge-cloudinary-image" src="${img.thumb}" style="width:100%;height:100%;object-fit:cover;display:block;" alt="${data.title} photo ${idx + 1}" decoding="async" loading="lazy">
      </button>`;
    }).join('');
    thumbsWrap.style.display = 'flex';
    thumbsWrap.querySelectorAll('.ge-modal-thumb-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        swapImageSource(modalImg, this.getAttribute('data-src'));
        thumbsWrap.querySelectorAll('.ge-modal-thumb-btn').forEach(b => b.style.borderColor = 'transparent');
        this.style.borderColor = '#00ffcc';
      });
    });
  } else if (thumbsWrap) {
    thumbsWrap.innerHTML = '';
    thumbsWrap.style.display = 'none';
  }

  const specList = document.getElementById('ge-modal-specs');
  specList.innerHTML = data.specs ? Object.entries(data.specs).map(([k, v]) => `
    <div class="ge-spec ge-spec--dark">
      <span class="ge-spec__key">${k}</span>
      <span class="ge-spec__lead"></span>
      <span class="ge-spec__val">${v}</span>
    </div>
  `).join('') : '';
  const modal = document.getElementById('ge-pc-modal');
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeMachineModal() {
  document.getElementById('ge-pc-modal').style.display = 'none';
  document.body.style.overflow = '';
}

// ===== ADAPTIVE HEADER TONE SWITCHING =====
function updateHeaderTone() {
  const header = document.querySelector('.ge-header');
  if (!header) return;
  const probe = header.getBoundingClientRect().bottom - 1;
  let tone = 'dark';
  document.querySelectorAll('[data-tone]').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.top <= probe && r.bottom > probe) {
      tone = el.getAttribute('data-tone');
    }
  });
  header.classList.toggle('ge-header--light', tone === 'light');
}

function queueHeaderToneUpdate() {
  if (_headerToneQueued) return;
  _headerToneQueued = true;
  requestAnimationFrame(() => {
    _headerToneQueued = false;
    updateHeaderTone();
  });
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function getSectionScrollTargetY(target) {
  if (!target) return 0;
  const header = document.querySelector('.ge-header');
  const headerOffset = header ? header.getBoundingClientRect().height : 0;
  return Math.max(0, target.getBoundingClientRect().top + window.pageYOffset - headerOffset);
}

function jumpToSection(target, onComplete) {
  if (!target) return;
  window.scrollTo(0, getSectionScrollTargetY(target));
  queueHeaderToneUpdate();
  focusScrollTarget(target);
  if (typeof onComplete === 'function') onComplete();
}

function smoothScrollToSection(target, onComplete) {
  if (!target) return;
  const startY = window.pageYOffset;
  const targetY = getSectionScrollTargetY(target);
  cancelAnimationFrame(_activeSmoothScroll);
  _activeSmoothScroll = 0;

  const distance = targetY - startY;
  const duration = Math.min(900, Math.max(500, Math.abs(distance) * 0.45));
  let startTime = 0;

  const step = (timestamp) => {
    if (!startTime) startTime = timestamp;
    const progress = Math.min((timestamp - startTime) / duration, 1);
    const eased = easeOutCubic(progress);
    window.scrollTo(0, startY + distance * eased);
    queueHeaderToneUpdate();
    if (progress < 1) {
      _activeSmoothScroll = requestAnimationFrame(step);
    } else {
      _activeSmoothScroll = 0;
      focusScrollTarget(target);
      if (typeof onComplete === 'function') onComplete();
    }
  };

  _activeSmoothScroll = requestAnimationFrame(step);
}

function focusScrollTarget(target) {
  if (!target || typeof target.focus !== 'function') return;
  const hadTabIndex = target.hasAttribute('tabindex');
  const isNativelyFocusable = target.matches('a, button, input, select, textarea, summary, [tabindex]');
  if (!isNativelyFocusable) {
    target.setAttribute('tabindex', '-1');
  }
  target.focus({ preventScroll: true });
  if (!hadTabIndex && !isNativelyFocusable) {
    requestAnimationFrame(() => target.removeAttribute('tabindex'));
  }
}

function initSmoothSectionLinks() {
  function handleSectionLinkActivation(link, e) {
    const href = link.getAttribute('href');
    if (!href || href === '#') return;
    const targetId = decodeURIComponent(href.slice(1));
    const target = document.getElementById(targetId) || document.getElementById(link.dataset.scroll);
    if (!target) return;
    if (prefersReducedMotion.matches) {
      e.preventDefault();
      if (window.location.hash === href) {
        jumpToSection(target);
        return;
      }
      jumpToSection(target, () => {
        if (window.location.hash !== href) {
          _skipNextHashChange = true;
          window.location.hash = href;
        }
      });
      return;
    }
    e.preventDefault();
    if (window.location.hash === href) {
      smoothScrollToSection(target);
      return;
    }
    smoothScrollToSection(target, () => {
      if (window.location.hash !== href) {
        _skipNextHashChange = true;
        window.location.hash = href;
      }
    });
  }

  document.addEventListener('click', function(e) {
    const link = e.target.closest('a[data-scroll][href^="#"]');
    if (!link) return;
    if (link.target && link.target !== '_self') return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.defaultPrevented) return;
    handleSectionLinkActivation(link, e);
  });
}

function handleHashAnchors() {
  if (_skipNextHashChange) {
    _skipNextHashChange = false;
    return;
  }
  if (!window.location.hash) return;
  const targetId = decodeURIComponent(window.location.hash.slice(1));
  const target = document.getElementById(targetId) || document.getElementsByName(targetId)[0];
  if (!target) return;
  jumpToSection(target);
}

// ===== BOOT =====
document.addEventListener('DOMContentLoaded', async function() {
  // Init Lucide icons
  if (typeof lucide !== 'undefined') lucide.createIcons();

  // Adaptive header on scroll
  window.addEventListener('scroll', queueHeaderToneUpdate, { passive: true });
  window.addEventListener('resize', queueHeaderToneUpdate, { passive: true });
  window.addEventListener('hashchange', handleHashAnchors);
  window.addEventListener('focus', () => { requestInventoryRefresh(INVENTORY_REFRESH_DEBOUNCE_MS); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) requestInventoryRefresh(INVENTORY_REFRESH_DEBOUNCE_MS);
  });
  initSmoothSectionLinks();
  handleHashAnchors();
  queueHeaderToneUpdate();

  // Modal close handlers
  document.getElementById('ge-modal-close')?.addEventListener('click', closeMachineModal);
  document.getElementById('ge-pc-modal')?.addEventListener('click', function(e) {
    if (e.target === this) closeMachineModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeMachineModal();
  });

  // Details buttons (delegated — injected after config loads)
  document.addEventListener('click', function(e) {
    const mediaTrigger = e.target.closest('[data-open-machine-token]');
    if (mediaTrigger) {
      const token = mediaTrigger.getAttribute('data-open-machine-token');
      if (token && _machineIdByToken[token]) openMachineModal(_machineIdByToken[token]);
      return;
    }
    const btn = e.target.closest('.ge-details-btn');
    if (!btn) return;
    const token = btn.getAttribute('data-machine-token');
    if (token && _machineIdByToken[token]) {
      openMachineModal(_machineIdByToken[token]);
      return;
    }
    openMachineModal(btn.getAttribute('data-machine-id'));
  });

  // Load images from config
  try {
    await bootstrapSiteFromConfig();
  } catch (e) {
    console.error('Failed to load cloudinary-config.json:', e);
  }
});
</script>
