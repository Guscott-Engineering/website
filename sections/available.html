<!-- ============ AVAILABLE NOW ============ -->
<section id="available" data-tone="light" style="background:var(--paper);scroll-margin-top:72px;">
  <div style="max-width:1100px;margin:0 auto;padding:88px 24px;">
    <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--volt-600);margin-bottom:10px;">Available Now</div>
    <h2 style="font-family:var(--font-display);font-weight:700;font-size:clamp(28px,3.4vw,40px);color:var(--ink-900);margin:0 0 8px;letter-spacing:.005em;">Ready to ship</h2>
    <p style="font-size:16px;line-height:1.6;color:var(--text-muted);max-width:54ch;margin:0 0 38px;">Each machine is fully assembled, bench-tested, and ready for local pickup in Atlanta. Message Ayden to claim one.</p>

    <!-- Cloudinary Dynamic Gallery Container -->
    <div id="cloudinary-galleries" style="display:grid;gap:24px;"></div>
  </div>
</section>

<!-- Cloudinary Gallery Manager Script -->
<script>
(async () => {
  const CLOUD_NAME = 'guscottengineeringcomputers';
  
  // Machine configurations - easy to add/remove machines
  // If a machine has no images in Cloudinary, it will NOT display on the website
  const machines = [
    { id: 'm1', folderTag: 'PC1', title: 'Custom PC Workstation 01', price: '$800' },
    { id: 'm2', folderTag: 'PC2', title: 'Custom PC Workstation 02', price: '$900' },
    { id: 'm3', folderTag: 'PC3', title: 'Custom PC Workstation 03', price: '$1100' },
    { id: 'm4', folderTag: 'PC4', title: 'Custom PC Workstation 04', price: '$1200' },
    { id: 'm5', folderTag: 'PC5', title: 'Custom PC Workstation 05', price: '$1500' },
  ];

  // Fetch images from Cloudinary folder
  async function fetchCloudinaryImages(folderTag) {
    try {
      const response = await fetch(
        `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${folderTag}.json`
      );
      const data = await response.json();
      
      if (!data.resources || data.resources.length === 0) {
        return []; // Return empty array if no images found
      }

      return data.resources.map((file) => ({
        id: file.public_id,
        uri: `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/v${file.version}/${file.public_id}.${file.format}`,
        thumbUri: `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/c_thumb,w_150/v${file.version}/${file.public_id}.${file.format}`,
      }));
    } catch (error) {
      console.error(`Error loading Cloudinary images for ${folderTag}:`, error);
      return [];
    }
  }

  // Create gallery HTML for a machine
  function createGalleryHTML(machine, images) {
    const mainImage = images[0];
    const thumbnailsHTML = images
      .map((img, idx) => `
        <button 
          class="ge-thumb-btn" 
          data-machine="${machine.id}"
          data-image-idx="${idx}"
          style="flex:none;width:54px;height:54px;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:var(--ink-1000);cursor:pointer;${idx === 0 ? 'border-color:#00ffcc;' : ''}"
        >
          <img src="${img.thumbUri}" alt="${machine.title}" style="width:100%;height:100%;object-fit:cover;display:block;">
        </button>
      `)
      .join('');

    return `
      <div class="ge-card ge-card--pad">
        <div style="position:relative;">
          <div class="ge-cut" style="background:var(--ink-1000);aspect-ratio:4/5;">
            <img id="${machine.id}-main" src="${mainImage.uri}" alt="${machine.title}" style="width:100%;height:100%;object-fit:cover;display:block;">
          </div>
          <div style="position:absolute;top:12px;left:12px;">
            <span class="ge-badge ge-badge--volt"><span class="ge-badge__dot"></span>In stock</span>
          </div>
        </div>
        <h3 style="margin:16px 0 8px;font-size:18px;font-weight:600;color:var(--ink-900);">${machine.title}</h3>
        <p style="margin:0 0 12px;font-size:16px;font-weight:bold;color:var(--volt-600);">${machine.price}</p>
        <div style="display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;">
          ${thumbnailsHTML}
        </div>
      </div>
    `;
  }

  // Load all galleries
  const galleriesContainer = document.getElementById('cloudinary-galleries');
  const availableSection = document.getElementById('available').parentElement;
  let hasAnyMachines = false;
  
  for (const machine of machines) {
    const images = await fetchCloudinaryImages(machine.folderTag);
    
    // Only display machine if it has images
    if (images.length > 0) {
      hasAnyMachines = true;
      const html = createGalleryHTML(machine, images);
      galleriesContainer.insertAdjacentHTML('beforeend', html);

      // Attach click handlers to thumbnails
      document.querySelectorAll(`[data-machine="${machine.id}"]`).forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.currentTarget.getAttribute('data-image-idx'));
          const mainImg = document.getElementById(`${machine.id}-main`);
          if (mainImg) {
            mainImg.src = images[idx].uri;
          }
          // Update active thumbnail styling
          document.querySelectorAll(`[data-machine="${machine.id}"]`).forEach(t => {
            t.style.borderColor = 'transparent';
          });
          e.currentTarget.style.borderColor = '#00ffcc';
        });
      });
    }
  }

  // Hide the entire "Available" section if no machines have images
  if (!hasAnyMachines) {
    document.getElementById('available').parentElement.style.display = 'none';
    console.warn('No machines with images found. Available section hidden.');
  }
})();
</script>
