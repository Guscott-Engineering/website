<!-- ============ PREVIOUSLY BUILT ============ -->
<section id="portfolio" data-tone="dark" style="position:relative;background:var(--ink-900);color:var(--ink-100);overflow:hidden;scroll-margin-top:72px;">
  <div style="position:absolute;width:720px;height:720px;left:-220px;bottom:-280px;border-radius:50%;background:radial-gradient(circle,rgba(45,91,255,.16) 0%,transparent 60%);pointer-events:none;"></div>
  <div style="position:relative;max-width:1100px;margin:0 auto;padding:88px 24px;">
    <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--volt-400);margin-bottom:10px;">Previously Built</div>
    <h2 style="font-family:var(--font-display);font-weight:700;font-size:clamp(28px,3.4vw,40px);color:#fff;margin:0 0 8px;letter-spacing:.005em;">Proof on the bench</h2>
    <p style="font-size:16px;line-height:1.6;color:var(--ink-300);max-width:54ch;margin:0 0 32px;">Past builds and projects loaded from Cloudinary.</p>
    <div id="portfolio-carousel" style="position:relative;margin-bottom:16px;">
      <!-- Portfolio carousel injected by cloudinary-config.json loader -->
    </div>
    <div class="ge-break-grid">
      <div>
        <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--volt-400);margin-bottom:8px;">Build log</div>
        <p style="font-size:15px;line-height:1.7;color:var(--ink-300);margin:0;">Each machine is bench-tested for stability before it ships.</p>
      </div>
      <div>
        <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--volt-400);margin-bottom:8px;">Specs vary</div>
        <p style="font-size:15px;line-height:1.7;color:var(--ink-300);margin:0;">CPU, GPU, RAM, and storage are spec'd to the project.</p>
      </div>
    </div>
  </div>
</section>
